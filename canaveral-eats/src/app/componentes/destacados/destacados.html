@if (destacados() && destacados().length > 0) {
  <p>Productos recibidos: {{ destacados.length }}</p>
  <div class="contenedor">
@for (destacado of destacados(); track $index) {
<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image"  [style.background-image]="'url(' + destacado.imagenSmall + ')'" ></div>
    <mat-card-title>x</mat-card-title>
    <mat-card-subtitle>{{destacado.nombre}}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="destacado.imagenGrande" alt="x">
  <mat-card-content>
    <p>{{destacado.descripcion}}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
}
</div>
}  @else {
  <p>No hay productos para mostrar.</p>
}
