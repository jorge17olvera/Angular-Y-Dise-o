<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ej1Flex.css">
</head>
<body>
    <header class="nav">
        <div class="contenedor nav__contenido">
            <h2 class="nav__logo">Café Aroma</h2>
            <nav class="nav__enlaces">
                <a href="#" class="nav__enlace">Inicio</a>
                <a href="#" class="nav__enlace">Carta</a>
                <a href="#" class="nav__enlace">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor principal">
        <img class="principal__imagen" src="foto.jpg" alt="Taza de café">
        <div class="principal__texto">
            <h1 class="principal__titulo">El mejor café de la ciudad</h1>
            <p class="principal__parrafo">Granos de origen, tostado diario y el rincón perfecto para empezar el día.</p>
            <a href="#" class="boton">Reservar mesa</a>
        </div>
    </main>
</body>
</html>
