<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes de precios</title>
    <link rel="stylesheet" href="ej3Flex.css">
</head>
<body>
    <section class="tarjetas">

        <article class="tarjeta">
            <h2 class="tarjeta__nombre">Básico</h2>
            <p class="tarjeta__precio">5 €/mes</p>
            <ul class="tarjeta__lista">
                <li>1 usuario</li>
                <li>5 GB de espacio</li>
                <li>Soporte por email</li>
            </ul>
            <a href="#" class="tarjeta__boton">Elegir plan</a>
        </article>

        <article class="tarjeta tarjeta--destacada">
            <h2 class="tarjeta__nombre">Pro</h2>
            <p class="tarjeta__precio">15 €/mes</p>
            <ul class="tarjeta__lista">
                <li>5 usuarios</li>
                <li>50 GB de espacio</li>
                <li>Soporte por email y chat</li>
                <li>Informes mensuales</li>
            </ul>
            <a href="#" class="tarjeta__boton">Elegir plan</a>
        </article>

        <article class="tarjeta">
            <h2 class="tarjeta__nombre">Premium</h2>
            <p class="tarjeta__precio">30 €/mes</p>
            <ul class="tarjeta__lista">
                <li>Usuarios ilimitados</li>
                <li>500 GB de espacio</li>
                <li>Soporte 24 horas</li>
            </ul>
            <a href="#" class="tarjeta__boton">Elegir plan</a>
        </article>

    </section>
</body>
</html>
