<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoturismo - Reserva</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <div class="logo"><h1>ECOTURISMO</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="listado.html">Rutas</a></li>
                <li><a href="detalle.html">Alojamiento</a></li>
                <li><a href="formulario.html"><strong>Reserva</strong></a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="centrar">
        <section id="inscripcion-evento">
            <h2>Formaliza tu Reserva</h2>
            <form action="formulario.html" method="POST">
                
                <fieldset>
                    <legend>Datos Personales</legend>
                    <div class="grupo-input">
                        <label for="nombre">Nombre y Apellidos</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="grupo-input">
                        <label for="dni">DNI / Pasaporte</label>
                        <input type="text" id="dni" name="dni" required>
                    </div>
                    <div class="grupo-input">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Selección de Ruta</legend>
                    <select name="ruta" id="ruta">
                        <option value="norte">Ruta del Norte</option>
                        <option value="circular">Ruta Circular Montaña</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Alojamiento</legend>
                    <label><input type="radio" name="alojamiento" value="refugio"> Refugio Rural</label>
                    <label><input type="radio" name="alojamiento" value="cabana"> Cabaña del Bosque</label>
                    <label><input type="radio" name="alojamiento" value="ninguno"> Sin alojamiento</label>
                </fieldset>

                <fieldset>
                    <legend>Observaciones</legend>
                    <textarea name="observaciones" id="observaciones" rows="4" placeholder="Indica alergias, requerimientos especiales..."></textarea>
                </fieldset>

                <button type="button" onclick="if (document.getElementById('nombre').value==''||document.getElementById('dni').value==''||document.getElementById('email').value=='') {
                        alert('Debes rellenar todos los campos')
                    }else{
                        alert('Ha sido enviado correctamente')
                        document.getElementById('nombre').value=''
                        document.getElementById('email').value=''
                        document.getElementById('dni').value=''
                    }"
                    
                    >Enviar inscripcion</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Ecoturismo. Proyecto sostenible.</p>
    </footer>
</body>
</html>
