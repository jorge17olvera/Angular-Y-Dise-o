services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html/api
    command: sh -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proyecto_angular
    ports:
      - "3306:3306"
    volumes:
      - datos_mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  datos_mysql:
