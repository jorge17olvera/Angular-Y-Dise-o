services:
  php-apache:
    build: .
    container_name: proyecto_php
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html/api
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: proyecto_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fichajes_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: proyecto_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  mysql_data: