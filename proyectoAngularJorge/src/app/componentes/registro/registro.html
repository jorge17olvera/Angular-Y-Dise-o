<div class="contenedor-auth">
  <h2>Registro de Nuevo Empleado</h2>

  <form [formGroup]="formularioRegistro" (ngSubmit)="registrar()">

    <div class="campo-form">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" formControlName="nombre" placeholder="Introduce tu nombre">
    </div>

    <div class="campo-form">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" formControlName="email" placeholder="ejemplo@empresa.com">
    </div>

    <div class="campo-form">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" formControlName="password" placeholder="Mínimo 4 caracteres">
    </div>

    <button type="submit" [disabled]="formularioRegistro.invalid">Crear cuenta</button>
  </form>

  <p class="enlace-alternativo">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
