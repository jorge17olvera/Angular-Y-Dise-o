<div class="contenedor-fichajes">
  <h2>Control de Horario</h2>

  <div class="acciones-superiores">
    <button class="btn-entrada" (click)="ficharEntrada()">Registrar Entrada Hoy</button>
  </div>

  <table class="tabla-fichajes">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Entrada</th>
        <th>Salida</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fichaje of listaFichajes">
        <td>{{ fichaje.fecha }}</td>
        <td>{{ fichaje.horaEntrada }}</td>
        <td>
          <span *ngIf="fichaje.horaSalida">{{ fichaje.horaSalida }}</span>
          <span *ngIf="!fichaje.horaSalida" class="en-curso">En curso...</span>
        </td>
        <td class="celdas-acciones">
          <button *ngIf="!fichaje.horaSalida" class="btn-salida" (click)="ficharSalida(fichaje.id)">
            Fichar Salida
          </button>
          <a [routerLink]="['/fichajes', fichaje.id]" class="btn-detalle">Ver Detalle</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
