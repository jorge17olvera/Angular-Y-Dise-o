<div class="contenedor-auth">
  <h2>Iniciar Sesión</h2>

  <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">

    <div class="campo-form">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" formControlName="email" placeholder="ejemplo@empresa.com">
    </div>

    <div class="campo-form">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" formControlName="password" placeholder="Mínimo 4 caracteres">
    </div>

    <button type="submit" [disabled]="formularioLogin.invalid">Entrar</button>
  </form>

  <p class="enlace-alternativo">
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
  </p>
</div>
