<div class="contenedor-dashboard">
  <header>
    <h2>Bienvenido, {{ sesionService.usuarioActual()?.nombre }}</h2>
    <p>Rol activo: <strong>{{ sesionService.usuarioActual()?.rol }}</strong></p>
  </header>

  <nav class="menu-empleado">
    <h3>Opciones de Empleado</h3>
    <button routerLink="/fichajes">Mis Fichajes</button>
    <button routerLink="/ropa">Catálogo de Ropa</button>
    <button routerLink="/carrito">Mi Carrito</button>
  </nav>

  @if (sesionService.usuarioActual()?.rol === 'admin') {
    <div class="zona-admin">
      <h3>Panel de Administración</h3>
      <button routerLink="/admin-fichajes">Gestionar Fichajes de Empleados</button>
    </div>
  }

  <div class="acciones-sesion">
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>
